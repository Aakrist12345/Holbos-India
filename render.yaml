services:
  - type: web
    name: holbos-attendance-erp
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: bash start.sh
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: holbos_attendance.holbos_project.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: holbos-db
          property: connectionString
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_RESET_PASSWORD
        sync: false
      - key: ALLOWED_HOSTS
        value: holbos-attendance-erp.onrender.com
    staticPublishPath: holbos_attendance/staticfiles
    healthCheckPath: "/"

databases:
  - name: holbos-db
    postgres:
      version: 15
